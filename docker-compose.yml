version: '3.8'

services:
  web:
    build: .
    container_name: lms-platform
    restart: always
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
      - DATABASE_URL=sqlite:///./lms.db
      - SECRET_KEY=replace-with-a-random-production-secret-key-32chars
    volumes:
      - lms-data:/app

volumes:
  lms-data:
